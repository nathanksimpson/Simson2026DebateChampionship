<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simson Debate Prep Lessons</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: classroom projector. Sticky day bar, step rail on the left (pills on phones), one large stage per step. */
:root{
  --paper:#f3f5f8; --surface:#ffffff; --ink:#18223a; --muted:#5b6478; --line:#d9dee8;
  --bell:#d98a12; --bell-soft:#fbf0dc;
  --gov:#1f5fbf; --gov-soft:#e3ecfa; --opp:#c0392b; --opp-soft:#fae6e3;
  --ok:#1e8a5a; --ok-soft:#e1f3ea; --no:#b3261e; --no-soft:#fbe4e2;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#11151f; --surface:#1a2030; --ink:#e8ecf4; --muted:#9aa3b8; --line:#2c3447;
  --bell:#f0a933; --bell-soft:#3a2d14; --gov:#6aa2f2; --gov-soft:#1a2a45; --opp:#f07a6c; --opp-soft:#43211d;
  --ok:#4cc58c; --ok-soft:#173527; --no:#f2867c; --no-soft:#42201d; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#11151f; --surface:#1a2030; --ink:#e8ecf4; --muted:#9aa3b8; --line:#2c3447;
  --bell:#f0a933; --bell-soft:#3a2d14; --gov:#6aa2f2; --gov-soft:#1a2a45; --opp:#f07a6c; --opp-soft:#43211d;
  --ok:#4cc58c; --ok-soft:#173527; --no:#f2867c; --no-soft:#42201d; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--bell);outline-offset:2px}

/* Day bar */
.daybar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.daybar-inner{display:flex;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:800;font-size:18px;margin-right:6px;white-space:nowrap}
.days{display:flex;gap:6px;flex-wrap:wrap;flex:1;min-width:0}
.day-tab{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:5px 10px;font-size:15px;cursor:pointer;text-align:left;line-height:1.2}
.day-tab small{display:block;color:var(--muted);font-size:12px}
.day-tab[aria-current="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.day-tab[aria-current="true"] small{color:inherit;opacity:.75}
.toggle{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);cursor:pointer;white-space:nowrap}
.toggle input{width:18px;height:18px;accent-color:var(--bell)}

/* Main grid */
.layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:28px;padding-block:24px 48px;max-width:1280px;margin:0 auto}
.rail{position:sticky;top:90px;align-self:start;display:flex;flex-direction:column;gap:4px}
.rail .goal{font-size:14px;color:var(--muted);margin-bottom:10px}
.rail .daytitle{font-family:var(--display);font-weight:800;font-size:22px;margin-bottom:4px}
.step-link{display:grid;grid-template-columns:62px 1fr;gap:8px;align-items:baseline;border:0;background:none;text-align:left;padding:8px 10px;border-radius:10px;cursor:pointer;color:var(--muted)}
.step-link .mins{font-family:var(--mono);font-size:13px}
.step-link[aria-current="true"]{background:var(--surface);color:var(--ink);box-shadow:inset 3px 0 0 var(--bell)}
.step-link:hover{color:var(--ink)}

.stage{min-width:0;display:flex;flex-direction:column;gap:20px}
.stage-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.eyebrow{font-family:var(--mono);font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--bell);font-weight:700}
.stage h2{font-size:clamp(28px,4vw,44px);font-weight:800;margin-top:4px}
.lead{font-size:20px;max-width:62ch;color:var(--ink)}

/* Step timer */
.timer{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px 10px 8px 14px}
.timer .clock{font-family:var(--mono);font-weight:700;font-size:28px;font-variant-numeric:tabular-nums;min-width:4.2ch;text-align:right}
.timer.done .clock{color:var(--bell)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:700}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.small{padding:5px 10px;font-size:15px}

.nav{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding-top:16px;margin-top:8px}

/* Content blocks */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.panel h3{font-size:22px;margin-bottom:8px}
ul.clean{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:6px}
.tag{display:inline-block;font-family:var(--mono);font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;letter-spacing:.04em}
.tag.gov{background:var(--gov-soft);color:var(--gov)}
.tag.opp{background:var(--opp-soft);color:var(--opp)}
.tag.bell{background:var(--bell-soft);color:var(--bell)}
.say{font-family:var(--display);font-weight:600;font-size:20px}
.muted{color:var(--muted)}
.big{font-size:22px}

.teacher{display:none;border:1px dashed var(--bell);background:var(--bell-soft);border-radius:14px;padding:14px 16px;font-size:16px}
.teacher b{font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--bell);display:block;margin-bottom:4px}
body.show-notes .teacher{display:block}

/* Rounds */
.rounds{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.round{border-radius:14px;padding:16px;border:1px solid var(--line);background:var(--surface)}
.round .rn{font-family:var(--mono);font-size:13px;color:var(--muted)}
.round h3{font-size:20px;margin:2px 0 8px}
.round.final{border-color:var(--bell);background:var(--bell-soft)}

/* Speaking order */
.order{display:flex;align-items:stretch;gap:6px;flex-wrap:wrap}
.spk{flex:1 1 120px;border-radius:14px;padding:12px;cursor:pointer;border:2px solid transparent;text-align:left;display:flex;flex-direction:column;gap:2px}
.spk.gov{background:var(--gov-soft)} .spk.opp{background:var(--opp-soft)}
.spk .ab{font-family:var(--display);font-weight:800;font-size:26px}
.spk.gov .ab{color:var(--gov)} .spk.opp .ab{color:var(--opp)}
.spk .nm{font-size:14px;color:var(--muted)}
.spk[aria-pressed="true"]{border-color:var(--ink)}
.spk .now{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--bell);visibility:hidden}
.spk.current .now{visibility:visible}
.prepchip{align-self:center;font-family:var(--mono);font-size:11px;color:var(--muted);writing-mode:horizontal-tb}
.spkdetail{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.bar{display:flex;border-radius:10px;overflow:hidden;height:46px;border:1px solid var(--line)}
.bar span{display:flex;align-items:center;justify-content:center;font-size:12px;line-height:1.1;text-align:center;padding:0 4px;border-right:1px solid var(--surface);overflow:hidden}
.bar.gov span:nth-child(odd){background:var(--gov-soft)} .bar.gov span:nth-child(even){background:var(--surface)}
.bar.opp span:nth-child(odd){background:var(--opp-soft)} .bar.opp span:nth-child(even){background:var(--surface)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:var(--muted)}
.legend b{font-family:var(--mono);color:var(--ink);font-weight:500}

/* CMI */
.cmi{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.cmi .panel{position:relative}
.cmi .k{font-family:var(--display);font-weight:800;font-size:26px}
.cmi .arel{font-family:var(--mono);font-size:12px;color:var(--muted)}

/* Ladder */
.ladder{display:flex;flex-direction:column-reverse;gap:8px}
.rung{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;align-items:start;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;text-align:left}
.rung .n{font-family:var(--display);font-weight:800;font-size:26px;color:var(--muted)}
.rung.aim{border-color:var(--bell)}
.rung.aim .n{color:var(--bell)}
.rung .ex{display:none;color:var(--muted);margin-top:4px}
.rung[aria-expanded="true"] .ex{display:block}

/* Speech timeline */
.tl{position:relative;padding-top:34px}
.tl-track{display:flex;height:54px;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.tl-track div{display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;text-align:center;padding:0 4px}
.z-prot{background:var(--paper);color:var(--muted)}
.z-poi{background:var(--ok-soft);color:var(--ok)}
.z-grace{background:var(--bell-soft);color:var(--bell)}
.z-dead{background:var(--no-soft);color:var(--no)}
.tl-marks{position:absolute;inset:0 0 auto;height:30px}
.tl-marks span{position:absolute;transform:translateX(-50%);font-family:var(--mono);font-size:12px;white-space:nowrap;color:var(--muted)}
.tl-marks span.bellm{color:var(--bell);font-weight:700}
.tl-head{position:absolute;top:28px;bottom:-6px;width:3px;background:var(--ink);border-radius:2px;transform:translateX(-50%);pointer-events:none}
#tl input[type=range]{width:100%;margin-top:14px;accent-color:var(--ink)}
.tl-status{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-top:10px}
.tl-status .clock{font-family:var(--mono);font-weight:700;font-size:34px;font-variant-numeric:tabular-nums}
.tl-status .msg{font-size:20px;font-weight:700}

/* Reveal cards */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.card{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:16px;display:flex;flex-direction:column;gap:10px;text-align:left;cursor:pointer}
.card .q{font-size:18px}
.card .a{display:none;padding:10px 12px;border-radius:10px;font-size:16px}
.card .a.yes{background:var(--ok-soft)} .card .a.no{background:var(--no-soft)}
.card .a strong{font-family:var(--display);font-size:20px}
.card[aria-expanded="true"] .a{display:block}
.card .hint{font-size:13px;color:var(--muted)}
.card[aria-expanded="true"] .hint{display:none}

/* Drill */
.drill{display:flex;flex-direction:column;gap:14px}
.drill .arg{font-family:var(--display);font-weight:600;font-size:clamp(22px,2.6vw,30px);line-height:1.3}
.frame{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.frame div{border-left:4px solid var(--bell);background:var(--paper);padding:10px 12px;border-radius:0 10px 10px 0;font-family:var(--display);font-weight:600}

/* Motion draw */
.draw{display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.draw .motion{font-family:var(--display);font-weight:800;font-size:clamp(24px,3.2vw,38px);line-height:1.2;min-height:2.4em}
.draw .motion.spin{opacity:.45}

/* Phases */
.phases{display:flex;flex-direction:column;gap:8px}
.phase{display:grid;grid-template-columns:90px minmax(0,1fr);gap:12px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.phase .pt{font-family:var(--mono);font-weight:700}
.phase.active{border-color:var(--bell);background:var(--bell-soft)}
.phase.past{opacity:.55}

/* Scores */
.scores{display:flex;flex-direction:column;gap:10px}
.score-row{display:grid;grid-template-columns:110px minmax(0,1fr);gap:12px;align-items:center}
.score-row .sb{height:36px;border-radius:8px;background:var(--ink);color:var(--paper);display:flex;align-items:center;padding:0 12px;font-family:var(--mono);font-weight:700;font-size:15px}

table{border-collapse:collapse;width:100%;font-size:16px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--mono);font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:700}
td.num{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.tablewrap{overflow-x:auto}

.checklist{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.checklist label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.checklist input{width:20px;height:20px;margin-top:3px;accent-color:var(--ok);flex:none}

a{color:var(--gov)}
.mats{display:flex;flex-direction:column;gap:10px}
.mat{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.mat h3{font-size:19px;margin:0}
.mat p{margin:2px 0 0;color:var(--muted);font-size:15px}
.mat .meta{font-family:var(--mono);font-size:12px;color:var(--muted)}
.mat a.btn{text-decoration:none;color:var(--ink);white-space:nowrap}
.today{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.today a{text-decoration:none;color:var(--ink);font-size:15px}
.today .lbl{font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-right:4px}
.day-tab.mats-tab{border-style:dashed}
@media (max-width:560px){.mat{grid-template-columns:minmax(0,1fr)}}

@media (max-width: 860px){
  .layout{grid-template-columns:minmax(0,1fr);gap:16px;padding-block:16px 40px}
  .rail{position:static;flex-direction:row;flex-wrap:wrap;gap:6px}
  .rail .goal,.rail .daytitle{width:100%}
  .step-link{grid-template-columns:auto;padding:6px 10px;border:1px solid var(--line)}
  .step-link .mins{display:none}
  .step-link[aria-current="true"]{box-shadow:none;border-color:var(--bell)}
  .brand{display:none}
  .days{flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px}
  .day-tab{flex:none}
  body{font-size:17px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

</head>
<body>
<header class="daybar">
  <div class="wrap daybar-inner">
    <div class="brand">Simson Debate Prep</div>
    <nav class="days" id="days" aria-label="Class days"></nav>
    <label class="toggle"><input type="checkbox" id="notesToggle"> Teacher notes</label>
  </div>
</header>

<div class="wrap">
  <div class="layout">
    <aside class="rail" id="rail" aria-label="Steps"></aside>
    <main class="stage" id="stage" aria-live="polite"></main>
  </div>
</div>

<script>
/* ---------- Data ---------- */
const SPEAKERS = [
  {id:'PM', name:'Prime Minister', side:'gov', poi:true,
   job:'Defines the motion and gives the first 2 arguments. Announces 3 arguments; the DPM gives the third. No rebuttal expected.',
   say:'"Today’s motion is… By ___, we mean… Our plan is simple:…"',
   parts:[['Motion & definition',25],['The problem',15],['Signposting',10],['Argument 1',55],['Argument 2',55],['Call to action',20]]},
  {id:'LO', name:'Leader of Opposition', side:'opp', poi:true,
   job:'Reframes the debate, rebuts the PM’s strongest point, then gives 2 arguments.',
   say:'"The Prime Minister wants you to believe… We reject this. The real debate is about…"',
   parts:[['Clash of visions',30],['Rebut the PM',35],['Signposting',10],['Argument 1',45],['Argument 2',40],['Promise',20]]},
  {id:'DPM', name:'Deputy Prime Minister', side:'gov', poi:true,
   job:'Rebuts the LO’s two arguments, rebuilds the PM’s case, and adds the third argument.',
   say:'"They want you to believe this debate is about… But the real debate is about…"',
   parts:[['Framing',20],['Rebuttal',50],['Rebuild',35],['New argument',55],['Summary',20]]},
  {id:'DLO', name:'Deputy Leader of Opposition', side:'opp', poi:true,
   job:'Rebuts the Government case (including the DPM), rebuilds the LO’s case, and adds the third argument.',
   say:'"They attacked our Leader’s point on ___ by saying ___. But that fails because ___."',
   parts:[['Framing',20],['Rebuttal',50],['Rebuild',35],['New argument',55],['Summary',20]]},
  {id:'GW', name:'Government Whip', side:'gov', poi:false,
   job:'Answers the last speaker, then explains why Government won the 2 biggest clashes. No new arguments. Receives no POIs.',
   say:'"Now, there are two clashes today. The first clash was… So we win this clash."',
   parts:[['Rebut last speaker',30],['Clash 1',55],['Clash 2',55],['Weighing',20],['Final ballot',20]]},
  {id:'OW', name:'Opposition Whip', side:'opp', poi:false,
   job:'Answers the last speaker, then explains why Opposition won the 2 biggest clashes. No new arguments. Receives no POIs.',
   say:'"Because we won on ___ and on ___, the ballot belongs to our side. Thank you."',
   parts:[['Rebut last speaker',30],['Clash 1',55],['Clash 2',55],['Weighing',20],['Final ballot',20]]}
];

const MOTIONS = [
  {id:'rent', month:'Jan', short:'Rent freezes', motion:'THBT rent freezes are a form of harmful populism.',
   words:'rent freeze · populism · landlord · tenant',
   clashes:['Do rent freezes hurt or help the housing market?','Who is protected, and who is left out?'],
   args:[{side:'gov',t:'Rent freezes make landlords stop renting or repairing homes, so there are fewer homes and rent jumps later. Look at Berlin in 2019.'},
         {side:'opp',t:'Rent freezes protect vulnerable people when rent rises faster than their income. Vienna’s strong rent rules keep homes affordable.'}]},
  {id:'atlas', month:'Mar', short:'Humanoid robots (Atlas)', motion:'THBT humanoid robots like Atlas must be restricted from fully replacing humans in automobile factories.',
   words:'humanoid · be restricted · automation · unemployment · productivity',
   clashes:['Does fast automation break society or move it forward?','Which matters more for growth: efficiency or customers who can buy?'],
   args:[{side:'gov',t:'If robots replace workers too fast, thousands lose their jobs at once and whole towns decline, like after Amazon automated its warehouses.'},
         {side:'opp',t:'Robots take dangerous jobs and create new industries. We should retrain workers, not stop technology, as BMW and Tesla show.'}]},
  {id:'profits', month:'Jul', short:'Excess profits', motion:'THBT companies’ excess profits should be distributed to workers before shareholders.',
   words:'excess profits · distribute · shareholder · bonus · investment',
   clashes:['Who deserves the reward: workers or shareholders?','Does sharing profits grow or shrink the company in the long run?'],
   args:[{side:'gov',t:'Workers create the profits every day, so they deserve a share first. Samsung’s 2026 bonus deal recognised this.'},
         {side:'opp',t:'If shareholders get less, investors leave and the company can’t pay for its future, like Samsung’s chip factories.'}]},
  {id:'public', month:'Aug', short:'Going public', motion:'THBT companies should become public companies when they want to grow.',
   words:'public company · private company · share · IPO · investor',
   clashes:['Is going public the best way to get money for growth?','Does stock market pressure make decisions better or worse?'],
   args:[{side:'gov',t:'Going public raises huge amounts of money that don’t have to be paid back like a loan. Amazon grew this way after 1997.'},
         {side:'opp',t:'Private companies can make bold, long-term bets without stock market pressure every three months, like SpaceX did.'}]},
  {id:'equality', month:'Sep', short:'Equality vs. equity', motion:'THBT treating everyone the same cannot achieve true equality.',
   words:'equality · equity · treat · achieve · reverse discrimination',
   clashes:['Do the same rules hide unequal starting points?','Is different treatment fair, or a new kind of unfairness?'],
   args:[{side:'gov',t:'The same rules keep old advantages: Seoul students were about 2.6 times more likely to get into SNU, mostly because of family money and tutoring.'},
         {side:'opp',t:'Equity can judge people by their group instead of their effort. That is reverse discrimination, as the US Supreme Court ruled in 2023.'}]}
];

const UNSEEN = [
  'THBT schools should ban smartphones during the school day.',
  'THBT AI tutors will do more good than harm for students.',
  'THBT cities should make public transport free.',
  'THBT companies should be allowed to choose a four-day work week.'
];

const POI_CARDS = [
  {q:'It’s 0:45 into the PM’s speech. Can you offer a POI?', ok:false, a:'No. The first minute is protected time. Wait for the single bell at 1:00.'},
  {q:'It’s 1:40 into the LO’s speech. You stand up. Nobody has offered a POI yet. Must the LO accept?', ok:true, a:'Yes. The first POI offered to a speaker cannot be declined.'},
  {q:'The DPM already took one POI. You offer a second at 2:00. Must he accept?', ok:false, a:'No. Second and later POIs can be declined. He can say "No thank you" and keep going.'},
  {q:'It’s 2:40 into the DLO’s speech. Can you offer a POI?', ok:false, a:'No. POIs close at 2:30, when the judge rings two bells.'},
  {q:'The Opposition Whip is speaking at 1:30. Can you offer a POI?', ok:false, a:'No. Whip speakers never receive POIs.'},
  {q:'Your POI question takes 25 seconds. Is that OK?', ok:false, a:'No. A POI must be under 15 seconds. Ask one short question.'},
  {q:'Does the speaker’s clock stop while you ask your POI?', ok:false, a:'No. The clock keeps running, so the speaker should answer in one sentence and go back to their point.'}
];

const LADDER = [

function tlUpdate(){
  const t = state.tl, head = document.getElementById('tlHead'); if(!head) return;
  head.style.left = (t/240*100)+'%';
  document.getElementById('tlClock').textContent = fmt(t);
  document.getElementById('tlRange').value = t;
  let m, c;
  if(t < 60){ m='Protected time: no POIs yet'; c='var(--muted)'; }
  else if(t < 150){ m='POI window open: stand to offer a POI'; c='var(--ok)'; }
  else if(t < 180){ m='Protected time: wrap up your speech'; c='var(--muted)'; }
  else if(t < 210){ m='Grace time: finish your sentence (no penalty)'; c='var(--bell)'; }
  else { m='Over 3:30: the judge stops scoring'; c='var(--no)'; }
  const msg = document.getElementById('tlMsg'); msg.textContent = m; msg.style.color = c;
}

/* ---------- Audio ---------- */
let actx = null;
function ding(times=1){
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    for(let i=0;i<times;i++){
      const t0 = actx.currentTime + i*0.35, o = actx.createOscillator(), g = actx.createGain();
      o.type='sine'; o.frequency.setValueAtTime(1320,t0);
      g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(0.4,t0+0.01); g.gain.exponentialRampToValueAtTime(0.0001,t0+1.1);
      o.connect(g).connect(actx.destination); o.start(t0); o.stop(t0+1.2);
    }
  }catch(e){}
}

/* ---------- Step timer ---------- */
function resetTimer(sec){ stopTimer(); timer = {left:sec,total:sec,running:false,id:null,done:false}; drawTimer(); }
function stopTimer(){ if(timer.id){ clearInterval(timer.id); timer.id=null; } timer.running=false; }
function drawTimer(){
  const c=$('tclock'); if(!c) return; c.textContent = fmt(timer.left);
  $('timer').classList.toggle('done', timer.done);
  const b=$('tstart'); if(b) b.textContent = timer.running ? 'Pause' : (timer.left<timer.total && !timer.done ? 'Resume' : 'Start');
  updatePhases();
}
function toggleTimer(){
  if(timer.running){ stopTimer(); drawTimer(); return; }
  if(timer.done) return;
  timer.running = true; let last = performance.now();
  timer.id = setInterval(()=>{
    const now = performance.now(); timer.left -= (now-last)/1000; last = now;
    if(timer.left<=0){ timer.left=0; timer.done=true; stopTimer(); ding(2); }
    drawTimer();
  }, 250);
  drawTimer();
}
function updatePhases(){
  const s = DAYS[state.day].steps[state.step], box = $('phases');
  if(!s.phases || !box) return;
  const el = (timer.total - timer.left)/60, started = timer.running || timer.left < timer.total;
  [...box.children].forEach((p,i)=>{
    const [a,b] = s.phases[i];
    p.classList.toggle('active', started && el>=a && el<b && !timer.done);
    p.classList.toggle('past', started && (el>=b || timer.done));
  });
}

/* ---------- Timeline play ---------- */
function stopTl(){ if(tlPlay){ clearInterval(tlPlay); tlPlay=null; const b=$('tlPlay'); if(b) b.textContent='Play at 10× speed'; } }
function playTl(){
  if(tlPlay){ stopTl(); return; }
  if(state.tl>=240) state.tl=0;
  $('tlPlay').textContent='Stop';
  tlPlay = setInterval(()=>{
    const prev = state.tl; state.tl = Math.min(240, state.tl+1);
    if(prev<60 && state.tl>=60) ding(1);
    if(prev<150 && state.tl>=150) ding(2);
    if(prev<180 && state.tl>=180) ding(3);
    tlUpdate(); if(state.tl>=240) stopTl();
  }, 100);
}

/* ---------- Draws ---------- */
function drawMotion(id, ex){
  const only = ex && ex.startsWith('only:') ? ex.slice(5).split(',') : ex==='opp' ? MOTIONS.filter(m=>m.id!=='public').map(m=>m.id) : null;
  const avoid = !only && ex && state.draws[ex]!=null ? state.draws[ex] : -1;
  let pool = MOTIONS.map((_,i)=>i).filter(i=>i!==avoid && (!only || only.includes(MOTIONS[i].id)));
  if(pool.length>1) pool = pool.filter(i=>i!==state.draws[id]);
  const pick = pool[Math.floor(Math.random()*pool.length)];
  const el = $('draw-'+id); let k = 0;
  el.classList.add('spin');
  const spin = setInterval(()=>{
    el.textContent = MOTIONS[k++ % MOTIONS.length].motion;
    if(k>8){ clearInterval(spin); state.draws[id]=pick; renderStageKeep(); }
  }, 90);
}

/* ---------- Events ---------- */
document.addEventListener('click', e=>{
  const b = e.target.closest('[data-act]'); if(!b) return;
  const a = b.dataset.act, i = +b.dataset.i;
  const d = DAYS[state.day];
  if(a==='mats'){ state.mats = true; render(); window.scrollTo({top:0}); }
  else if(a==='jump'){ document.getElementById(b.dataset.to)?.scrollIntoView({behavior:'smooth'}); }
  else if(a==='day') go(i,0);
  else if(a==='step') go(state.day,i);
  else if(a==='next'){ if(state.step<d.steps.length-1) go(state.day,state.step+1); else if(state.day<DAYS.length-1) go(state.day+1,0); }
  else if(a==='prev'){ if(state.step>0) go(state.day,state.step-1); else if(state.day>0) go(state.day-1,DAYS[state.day-1].steps.length-1); }
  else if(a==='tstart') toggleTimer();
  else if(a==='treset') resetTimer(timer.total);
  else if(a==='spk'){ state.spk=i; renderStageKeep(); }
  else if(a==='nextspk'){ state.cur=Math.min(SPEAKERS.length-1,state.cur+1); state.spk=state.cur; renderStageKeep(); }
  else if(a==='prevspk'){ state.cur=Math.max(0,state.cur-1); state.spk=state.cur; renderStageKeep(); }
  else if(a==='toggle'){ b.setAttribute('aria-expanded', b.getAttribute('aria-expanded')==='true'?'false':'true'); }
  else if(a==='tlplay') playTl();
  else if(a==='draw') drawMotion(b.dataset.id, b.dataset.ex);
  else if(a==='unseen'){ let n; do{ n=Math.floor(Math.random()*UNSEEN.length);}while(n===state.unseen && UNSEEN.length>1); state.unseen=n; renderStageKeep(); }
  else if(a==='nextreb'){ let n; do{ n=Math.floor(Math.random()*REB.length);}while(n===state.rebI || !['rent','atlas'].includes(MOTIONS[REB[n].m].id)); state.rebI=n; renderStageKeep(); }
});
/* Re-render the stage without resetting the running step timer */
function renderStageKeep(){
  const saved = {...timer}; const wasRunning = timer.running; stopTimer();
  renderStage();
  timer = {...saved, id:null, running:false}; drawTimer();
  if(wasRunning) toggleTimer();
}
document.addEventListener('keydown', e=>{
  if(state.mats || e.target.matches('input, textarea, select')) return;
  if(e.key==='ArrowRight'){ document.querySelector('[data-act="next"]:not([disabled])')?.click(); }
  else if(e.key==='ArrowLeft'){ document.querySelector('[data-act="prev"]:not([disabled])')?.click(); }
});
$('notesToggle').addEventListener('change', e=>{
  document.body.classList.toggle('show-notes', e.target.checked);
  try{ localStorage.setItem('simsonLessonNotes', e.target.checked?'1':'0'); }catch(err){}
});

/* ---------- Start ---------- */
function fromHash(){
  const m = location.hash.match(/^#day-(\d)-step-(\d+)$/);
  if(m){ const d=+m[1]-1, s=+m[2]-1; if(DAYS[d] && DAYS[d].steps[s]) return {d,s}; }
  return null;
}
(function init(){
  if(location.hash==='#materials'){ state.mats = true; }
  let pos = fromHash();
  if(!pos){ try{ pos = JSON.parse(localStorage.getItem('simsonLessonPos')||'null'); }catch(e){} }
  if(pos && DAYS[pos.d] && DAYS[pos.d].steps[pos.s]){ state.day=pos.d; state.step=pos.s; }
  try{ if(localStorage.getItem('simsonLessonNotes')==='1'){ $('notesToggle').checked=true; document.body.classList.add('show-notes'); } }catch(e){}
  render();
  window.addEventListener('hashchange', ()=>{ if(location.hash==='#materials'){ if(!state.mats){ state.mats=true; render(); } return; } const p=fromHash(); if(p && (p.d!==state.day||p.s!==state.step)) go(p.d,p.s); });
})();
</script>
